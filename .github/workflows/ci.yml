name: CI

on:
  pull_request:
  push:
    branches: [main, sih-refactor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - name: Typecheck tests
        run: |
          if npm run | grep -q "typecheck:test"; then npm run typecheck:test; else echo "no typecheck:test script"; fi
      - run: npm test
      - run: npm run build
      - name: Bundle must not contain server-only secrets
        run: |
          if grep -rEl "DETECTION_API_KEY|SERVICE_ROLE" dist/; then
            echo "::error::Server-only secret names found in the client bundle (see files above)."
            exit 1
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  python:
    name: Python pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  database:
    name: Database migrations + pgTAP (RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Starts only Postgres and applies supabase/migrations in order.
      - run: supabase db start
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if the repository belongs to a GitHub organization:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
